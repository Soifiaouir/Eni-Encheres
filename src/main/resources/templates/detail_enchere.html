<!DOCTYPE html>
<html >
</head>
<body>
    <main>
    <h2>Affichage Liste d'enchere</h2>
        <table>
            <thead>
            <tr>
                <th>Date de l'enchere</th>
                <th>Prix de l'enchere</th>
                <th>Nom de l'article</th>
                <th>Nom Encherisseur</th>
            </tr>
            </thead>
            <tbody>
                <tr data-th-each="enchere : ${encherelst}">
                    <td data-th-text="${enchere.dateEnchere}"></td>
                    <td data-th-text="${enchere.montantEnchere}"></td>
                    <td data-th-text="${enchere.articleConcerne.nomArticle}"></td>
                    <td data-th-text="${enchere.encherisseur.getNom()+' '+enchere.encherisseur.getPrenom()}"></td>
                </tr>
            </tbody>
        </table>

        <h2>Afficher toutes les encheres d'un utilisateur</h2>
        <ul data-th-each="enchereUtil : ${encheresU}">
            <li data-th-text="${enchereUtil.dateEnchere}"></li>
            <li data-th-text="${enchereUtil.montantEnchere}"></li>
            <li data-th-text="${enchereUtil.encherisseur.getNom()+' '+enchereUtil.encherisseur.getNom()}"></li>
        </ul>
    </main>
</body>
</html>
